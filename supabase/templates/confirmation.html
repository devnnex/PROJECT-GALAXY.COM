<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Confirma tu acceso a PROJECT GALAXY</title>
  </head>
  <body style="margin:0;padding:0;background:#08070b;color:#f4f0fa;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#08070b;padding:32px 14px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#100d15;border:1px solid #2b2335;border-radius:18px;overflow:hidden;">
            <tr>
              <td style="height:5px;background:linear-gradient(90deg,#6840bb,#a66cff,#6840bb);font-size:0;line-height:0;">&nbsp;</td>
            </tr>
            <tr>
              <td style="padding:38px 38px 12px;text-align:center;">
                <div style="display:inline-block;width:58px;height:58px;line-height:58px;border-radius:50%;background:#241834;border:1px solid #533b72;color:#c8a8ff;font-size:28px;">✦</div>
                <p style="margin:20px 0 8px;color:#a77bf9;font-size:11px;font-weight:700;letter-spacing:2.5px;">PROJECT GALAXY</p>
                <h1 style="margin:0;color:#ffffff;font-size:29px;line-height:1.2;font-weight:650;">Confirma tu coordenada</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:12px 38px 38px;text-align:center;">
                <p style="margin:0 auto 26px;max-width:420px;color:#aaa1b4;font-size:15px;line-height:1.7;">Recibimos una solicitud para crear tu identidad. Confirma este correo para activar tu acceso seguro.</p>
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:15px 28px;border-radius:10px;background:#8759df;color:#ffffff;text-decoration:none;font-size:14px;font-weight:700;">Confirmar mi cuenta</a>
                <p style="margin:28px 0 0;color:#6f6877;font-size:12px;line-height:1.6;">Si no creaste esta cuenta, puedes ignorar este mensaje con seguridad.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 30px;border-top:1px solid #241e2c;text-align:center;color:#5f5868;font-size:10px;letter-spacing:1px;">IDENTIDAD PRIVADA · ACCESO VERIFICADO</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
