[auth]
enable_anonymous_sign_ins = true

[functions.turn-credentials]
verify_jwt = true

[functions.scanner-download]
verify_jwt = true

# Authenticated exclusively by the private database-to-function dispatch secret.
[functions.push-notifications]
verify_jwt = false

# Called exclusively by the private, server-side scanner dispatch secret.
[functions.scanner-signals]
verify_jwt = false

# Private database-to-server dispatch; Telegram credentials never reach clients.
[functions.scanner-telegram]
verify_jwt = false

# Validates the current JWT and active membership inside the handler.
[functions.telegram-access]
verify_jwt = false

# Receives Telegram updates authenticated by its private webhook secret.
[functions.telegram-community]
verify_jwt = false
